{% extends "base.html" %}

{% block title %}Password updated | Berlin Imports{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl px-4 py-16 text-center sm:px-6 lg:px-8">
    <h1 class="text-3xl font-bold tracking-tight">Password updated</h1>
    <p class="mt-4 text-slate-600">Your password has been changed. You can now log in with the new password.</p>
    <a class="mt-6 inline-flex rounded-md bg-slate-950 px-5 py-3 font-semibold text-white hover:bg-slate-800" href="{% url 'accounts:login' %}">Log in</a>
</section>
{% endblock %}
